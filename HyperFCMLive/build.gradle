plugins {
    id 'com.android.application'
}

def localProperties = new Properties()
def localPropertiesFile = project.rootProject.file('local.properties')
if (localPropertiesFile.exists()) {
    localProperties.load(localPropertiesFile.newDataInputStream())
}

def environmentSigning = [
    storeFile: System.getenv('ANDROID_KEYSTORE_PATH'),
    storePassword: System.getenv('ANDROID_KEYSTORE_PASSWORD'),
    keyAlias: System.getenv('ANDROID_KEY_ALIAS'),
    keyPassword: System.getenv('ANDROID_KEY_PASSWORD')
]
def localSigning = [
    storeFile: localProperties.getProperty('storeFile'),
    storePassword: localProperties.getProperty('storePassword'),
    keyAlias: localProperties.getProperty('keyAlias'),
    keyPassword: localProperties.getProperty('keyPassword')
]
def completeSigningConfig = { values ->
    values.values().every { value -> value != null && !value.trim().isEmpty() }
}
def releaseSigning = completeSigningConfig(environmentSigning) ? environmentSigning :
    (completeSigningConfig(localSigning) ? localSigning : null)
def hasReleaseSigning = releaseSigning != null
if (hasReleaseSigning && !project.rootProject.file(releaseSigning.storeFile).isFile()) {
    throw new GradleException('The configured Android release keystore does not exist.')
}

android {
    compileSdk 37

    defaultConfig {
        applicationId namespace
        minSdkVersion 27
        targetSdkVersion 37
        versionCode rootProject.ext.commitCount
        versionName "1.5.0-beta5"
    }

    signingConfigs {
        if (hasReleaseSigning) {
            release {
                storeFile project.rootProject.file(releaseSigning.storeFile)
                storePassword releaseSigning.storePassword
                keyAlias releaseSigning.keyAlias
                keyPassword releaseSigning.keyPassword
            }
        }
    }

    buildTypes {
        release {
            if (hasReleaseSigning) {
                signingConfig signingConfigs.release
            }
            minifyEnabled true
            proguardFiles 'proguard-rules.pro'
            vcsInfo.include false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
    }

    dependenciesInfo {
        includeInApk false
        includeInBundle false
    }

    packagingOptions {
        resources {
            excludes += ['kotlin/**', 'META-INF/androidx/**']
        }
    }

    lint {
        checkReleaseBuilds false
    }

    dependenciesInfo.includeInApk false
    namespace 'io.github.howard20181.hyperos.fcmlive'
}

gradle.taskGraph.whenReady { taskGraph ->
    def releasePackagingTasks = taskGraph.allTasks.findAll { task ->
        task.project == project && task.name in ['assembleRelease', 'bundleRelease', 'packageRelease', 'installRelease']
    }
    if (!releasePackagingTasks.isEmpty() && !hasReleaseSigning) {
        throw new GradleException('Release APK/AAB tasks require signing. Set Android signing environment variables or local.properties.')
    }
}

base {
    archivesName = project.name + "-" + android.defaultConfig.versionName + "." + android.defaultConfig.versionCode
}

dependencies {
    compileOnly 'androidx.annotation:annotation:1.10.0'
    compileOnly 'io.github.libxposed:api:102.0.0'
    implementation 'io.github.libxposed:service:102.0.0'
    compileOnly project(":hiddenapi:stubs")
    implementation project(":hiddenapi:bridge")
}

apply from: 'fcm-tests.gradle'
